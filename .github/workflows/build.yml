name: Build Windows Agent

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Go 1.20 is the final supported toolchain for Windows 7 and 8.
          go-version: "1.20"
          cache: true

      - name: Prepare Go modules and vendor
        run: |
          go mod tidy
          go mod vendor

      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Path build/bin -Force | Out-Null
          go build -mod=vendor -ldflags="-H=windowsgui -s -w" -o build/bin/SmartPrintAgent.exe .
          Copy-Item build/windows/SmartPrintAgent.exe.manifest build/bin/SmartPrintAgent.exe.manifest

      - name: Compile Inno Setup Installer (C:\Program Files Setup)
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            choco install innosetup --no-progress
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartPrintAgent-windows
          path: build/bin/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
